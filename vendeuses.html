<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendeuses — Les Reines de l’Entrepreneuriat</title><link rel="icon" href="assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap"><div class="card"><div id="hdr"></div><div id="bn"></div>
<div class="blk"><div class="sh"><h2>Nos vendeuses</h2></div><div class="sellers" id="sellers"></div></div>
<footer class="foot"><a class="brand" href="index.html"><img src="assets/logo.jpg" alt=""><span><b>Les Reines</b><small>de l’Entrepreneuriat</small></span></a><div class="fl"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 6h13v10H1z"/><path d="M14 9h4l3 3v4h-7"/></svg>Livraison<br>selon la vendeuse</span><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l13-3v3"/></svg>Paiement<br>à la vendeuse</span><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Service client<br>via WhatsApp</span></div><div class="fc">© 2026 Les Reines de l’Entrepreneuriat. Tous droits réservés.</div></footer></div></div>
<script type="module">
import {sb,me,requireRole} from './js/supabase.js';
import * as cart from './js/cart.js';
import {$,esc,money,img,firstImg,toast,card,PSEL,header,seller,logout,ic,ICONS,favs,mini} from './js/ui.js';
const user=await header();

import {DEMO} from './js/demo.js';import {DEMO_WHEN_EMPTY as DEMO_ON} from './js/config.js';
const {data}=await sb.from('seller_profiles').select('id,shop_name,logo_path,location').eq('status','active').order('shop_name');
// Mêmes exemples que sur l'accueil tant qu'aucune boutique n'existe, pour que le lien « Voir toutes les vendeuses » ne mène pas à une page vide.
const demo=!(data&&data.length)&&DEMO_ON;
$('#sellers').innerHTML=demo?'<p class="note demo-note">Exemples de présentation : les boutiques des membres arrivent bientôt.</p>'+DEMO.sellers.map(x=>`<div class="s"><div class="av">${esc(x.shop_name[0])}</div><b>${esc(x.shop_name)}</b><small>${esc(x.location)}</small><button class="btn out sm" data-demo>Voir la boutique</button></div>`).join(''):(data||[]).map(x=>`<div class="s">${x.logo_path?`<img class="av" src="${img(x.logo_path)}" alt="">`:`<div class="av">${esc(x.shop_name[0])}</div>`}<b>${esc(x.shop_name)}</b><small>${esc(x.location||'')}</small><a class="btn out sm" href="vendeuse.html?id=${x.id}">Voir la boutique</a></div>`).join('')||'<p class="mut">Les premières boutiques arrivent bientôt.</p>';

</script></body></html>
