<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon espace — Les Reines de l’Entrepreneuriat</title><link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap"><div class="card"><div id="hdr"></div><div id="bn"></div>
<main id="app" class="w"></main>
<footer class="foot" id="ftr"></footer></div></div>
<script type="module">
import {sb,me,requireRole} from './js/supabase.js';
import * as cart from './js/cart.js';
import {$,esc,money,img,firstImg,toast,card,PSEL,header,seller,logout,ic,ICONS,favs,mini,statusBadge,statusSelect} from './js/ui.js';
const user=await header();

const u=await requireRole(['client']);if(!u)throw 0;
$('#app').innerHTML=`<h1>Bonjour ${esc(u.full_name)}</h1>${new URLSearchParams(location.search).has('attente')?'<div class="note"><b>Votre numéro est reconnu comme membre du groupe.</b><br>L’administration doit maintenant valider votre boutique. Vous recevrez la confirmation ; vous pourrez alors vous connecter avec votre numéro WhatsApp et gérer vos produits.</div>':''}<p><button class="btn ghost sm" id="lo">Déconnexion</button></p><h2>Mes commandes</h2><div id="o">Chargement…</div>`;$('#lo').onclick=logout;
const {data}=await sb.from('orders').select('ref,created_at,seller_orders(ref,total,status,seller_profiles(shop_name),order_items(name,qty,unit_price))').order('created_at',{ascending:false});
$('#o').innerHTML=(data||[]).map(o=>`<div class="box"><b>${esc(o.ref)}</b> <span class="mut">${new Date(o.created_at).toLocaleDateString('fr-FR')}</span>${o.seller_orders.map(s=>`<p><b>${esc(s.seller_profiles.shop_name)}</b> · ${money(s.total)} ${statusBadge(s.status)}<br>${s.order_items.map(i=>`${esc(i.name)} × ${i.qty}`).join(', ')}</p>`).join('')}</div>`).join('')||'<p class="mut">Aucune commande pour le moment.</p>';

</script></body></html>
