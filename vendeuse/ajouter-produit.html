<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produit — Espace vendeuse</title><link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body class="app">
<div class="app-shell"><aside class="app-side" id="sidebar"></aside><main class="app-main"><header class="app-top" id="top"></header><div id="bn"></div><div id="app"></div></main></div>
<script type="module">
import {sb} from './js/supabase.js';
import {$,esc,money,img,toast,ic,seller,empty} from './js/ui.js';
// Même page pour ajouter (sans ?id) et modifier (?id=…) ; modifier-produit.html redirige ici.
const id=new URLSearchParams(location.search).get('id');
const S=await seller('ajouter-produit.html',{title:id?'Modifier le produit':'Ajouter un produit',
 sub:'Votre produit est publié immédiatement dans la boutique. L’administration peut le désactiver en cas de besoin.',
 actions:'<a class="btn ghost" href="mes-produits.html">Mes produits</a>'});
if(!S)throw 0;
const {u,shop}=S;let p=null,im=[];
const IMG_OK=x=>['image/jpeg','image/png','image/webp'].includes(x.type)&&x.size<=3*1024*1024;

const {data:cats}=await sb.from('categories').select('id,name').order('name');
if(id){const r=await sb.from('products').select('*,product_images(id,path,position)').eq('id',id).eq('seller_id',u.id).maybeSingle();p=r.data;
 if(!p){$('#app').innerHTML=`<div class="panel">${empty('box','Produit introuvable','Il a peut-être été supprimé.','<a class="btn" href="mes-produits.html">Retour à mes produits</a>')}</div>`;throw 0}
 im=[...p.product_images].sort((a,b)=>a.position-b.position)}

$('#app').innerHTML=`<div class="form-layout"><div class="panel"><form id="f" class="f">
 <h2 class="sect">Le produit</h2>
 <label>Nom du produit<input name="name" required maxlength="120" value="${esc(p?.name||'')}"></label>
 <label>Description<span class="hint">Matière, taille, couleur, délai de fabrication… ce qui aide la cliente à choisir.</span><textarea name="description" rows="5" maxlength="2000">${esc(p?.description||'')}</textarea></label>
 <div class="two"><label>Prix (FCFA)<input type="number" name="price" required min="1" max="100000000" step="1" value="${p?.price_fcfa||''}"></label><label>Stock<input type="number" name="stock" min="0" step="1" value="${p?.stock??1}"></label></div>
 <label>Niche<select name="cat" required><option value="">Choisir…</option>${(cats||[]).map(c=>`<option value="${c.id}"${c.id===p?.category_id?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
 <label class="switch"><input type="checkbox" name="av"${p&&!p.is_available?'':' checked'}> Disponible à la commande</label>
 <h2 class="sect">Photos</h2>
 <label>Ajouter des photos<span class="hint">JPG, PNG ou WebP, 3 Mo maximum chacune. La première photo est la photo principale.</span><input type="file" name="ph" multiple accept="image/jpeg,image/png,image/webp"></label>
 <div class="ph-grid" id="old">${im.map(i=>`<span><img src="${img(i.path)}" alt=""><button type="button" data-r="${i.id}" data-p="${esc(i.path)}" title="Retirer cette photo" aria-label="Retirer cette photo">${ic('close')}</button></span>`).join('')}</div>
 <div class="form-actions"><button class="btn">${p?'Enregistrer les modifications':'Publier le produit'}</button><a class="btn ghost" href="mes-produits.html">Annuler</a></div>
</form></div>
<aside class="panel sticky"><div class="panel-h"><h2>Aperçu</h2></div>
 <div class="p"><div class="ph"><img id="pi" src="${img(im[0]?.path)}" alt=""></div><div class="pb"><b id="pn">${esc(p?.name||'Nom du produit')}</b><div class="pr" id="pp">${p?money(p.price_fcfa):'0 FCFA'}</div><div class="sl">${esc(shop.shop_name)}</div></div></div>
 <p class="mut" style="font-size:12.5px;margin:10px 0 0">Voici comment la carte apparaîtra dans la boutique.</p></aside></div>`;

const f=$('#f');
f.name.oninput=()=>$('#pn').textContent=f.name.value||'Nom du produit';
f.price.oninput=()=>$('#pp').textContent=money(f.price.value||0);
f.ph.onchange=()=>{const x=f.ph.files[0];if(x)$('#pi').src=URL.createObjectURL(x)};
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(!confirm('Retirer cette photo ?'))return;
 await sb.storage.from('shop-media').remove([b.dataset.p]);const {error}=await sb.from('product_images').delete().eq('id',b.dataset.r);
 if(error)return toast(error.message,1);im=im.filter(i=>i.id!==b.dataset.r);b.parentElement.remove();toast('Photo retirée')});
f.onsubmit=async e=>{e.preventDefault();const bt=f.querySelector('button:not([type])');bt.disabled=true;
 try{const files=[...f.ph.files];for(const x of files)if(!IMG_OK(x))throw new Error('Image invalide : JPG, PNG ou WebP, 3 Mo maximum.');
  const price=Number(f.price.value);if(!Number.isInteger(price)||price<1)throw new Error('Prix invalide : un nombre entier de FCFA.');
  // seller_id n'est pas envoyé : il est imposé par la base (auth.uid()) et vérifié par RLS.
  const v={name:f.name.value.trim(),description:f.description.value.trim(),price_fcfa:price,category_id:f.cat.value,stock:Number(f.stock.value)||0,is_available:f.av.checked};
  const r=p?await sb.from('products').update(v).eq('id',p.id).select('id').single():await sb.from('products').insert(v).select('id').single();if(r.error)throw r.error;
  let pos=im.length;for(const x of files){const path=`${u.id}/${r.data.id}/${crypto.randomUUID()}.${x.type.split('/')[1]}`;
   const up=await sb.storage.from('shop-media').upload(path,x,{contentType:x.type});if(up.error)throw up.error;
   await sb.from('product_images').insert({product_id:r.data.id,path,position:pos++})}
  toast(p?'Produit enregistré':'Produit publié');setTimeout(()=>location.href='mes-produits.html',800)}
 catch(x){toast(x.message||'Enregistrement impossible. Votre boutique est-elle active ?',1);bt.disabled=false}};
</script></body></html>
