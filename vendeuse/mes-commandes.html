<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commandes — Espace vendeuse</title>
<meta name="robots" content="noindex"><link rel="manifest" href="vendeuse.webmanifest"><meta name="theme-color" content="#6a1233"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Les Reines"><link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://wxdmdvxmxhoijfyshyyg.supabase.co" crossorigin>
<link rel="modulepreload" href="js/vendor/supabase.js"><link rel="modulepreload" href="js/supabase.js"><link rel="modulepreload" href="js/config.js"><link rel="modulepreload" href="js/cart.js"><link rel="modulepreload" href="js/ui.js">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body class="app">
<div class="app-shell"><aside class="app-side" id="sidebar"></aside><main class="app-main"><header class="app-top" id="top"></header><div id="bn"></div><div id="app"></div></main></div>
<script type="module">
import {sb} from './js/supabase.js';
import {$,toast,seller,sellerOrderTable,empty} from './js/ui.js';
const S=await seller('vendeuse/mes-commandes.html',{title:'Commandes',sub:'Les demandes de vos clientes. Elles vous écrivent sur WhatsApp avec la référence : mettez à jour le statut au fil de l’échange.'});
if(!S)throw 0;

const {data,error}=await sb.from('seller_orders').select('id,ref,total,status,created_at,order_items(name,qty,option)').eq('seller_id',S.u.id).order('created_at',{ascending:false});
if(error)toast('Chargement impossible : '+error.message,1);
const O=data||[],FL=[['all','Toutes'],['nouvelle','Nouvelles'],['confirmee','Confirmées'],['livree','Livrées'],['annulee','Annulées']];let F='all';
function draw(){const L=F==='all'?O:O.filter(x=>x.status===F);
 $('#app').innerHTML=`<div class="toolbar"><div class="filters-row">${FL.map(([k,l])=>`<button type="button" class="chip${F===k?' on':''}" data-f="${k}">${l} <i>${k==='all'?O.length:O.filter(x=>x.status===k).length}</i></button>`).join('')}</div></div>
 <div class="panel flush">${L.length?sellerOrderTable(L):O.length?empty('cart','Aucune demande avec ce statut','Choisissez un autre filtre.')
  :empty('cart','Aucune demande pour le moment','Quand une cliente valide son panier, sa demande apparaît ici. Vérifiez que votre numéro WhatsApp est à jour pour qu’elle puisse vous écrire.','<a class="btn" href="vendeuse/profil-boutique.html">Vérifier ma boutique</a>')}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){F=b.dataset.f;draw()}});
// Le statut est enregistré par ui.js ; on met à jour les compteurs des filtres.
document.addEventListener('change',e=>{const s=e.target.closest('[data-so]');if(!s)return;const o=O.find(x=>x.id===s.dataset.so);if(o)o.status=s.value;setTimeout(draw)});
draw();
// Nouvelle commande reçue en direct (voir ui.js) : ajoutée en tête de liste, sans recharger la page
// (un rechargement couperait le son des alertes suivantes).
document.addEventListener('commande',async e=>{
 const {data:o}=await sb.from('seller_orders').select('id,ref,total,status,created_at,order_items(name,qty,option)').eq('id',e.detail.id).single();
 if(o&&!O.some(x=>x.id===o.id)){O.unshift(o);draw()}});
</script></body></html>
