<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique — Les Reines de l’Entrepreneuriat</title>
<meta name="description" content="La boutique d’une Reine de l’Entrepreneuriat : ses créations, ses horaires et son contact WhatsApp.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Les Reines de l’Entrepreneuriat"><meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Boutique — Les Reines de l’Entrepreneuriat"><meta property="og:description" content="La boutique d’une Reine de l’Entrepreneuriat : ses créations, ses horaires et son contact WhatsApp.">
<meta property="og:image" content="https://reinedelentrepreunariat.com/assets/hero.jpg"><meta property="og:image:width" content="1305"><meta property="og:image:height" content="1205"><meta name="twitter:card" content="summary_large_image"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6a1233"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Les Reines"><link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://wxdmdvxmxhoijfyshyyg.supabase.co" crossorigin>
<link rel="modulepreload" href="js/vendor/supabase.js"><link rel="modulepreload" href="js/supabase.js"><link rel="modulepreload" href="js/config.js"><link rel="modulepreload" href="js/cart.js"><link rel="modulepreload" href="js/ui.js">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap"><div class="card"><div id="hdr"></div><div id="bn"></div>
<main id="app" class="w"></main>
<footer class="foot" id="ftr"></footer></div></div>
<script type="module">
import { sb } from './js/supabase.js';
import { $, esc, img, ic, card, PSEL, header } from './js/ui.js';
import { waLink } from './js/cart.js';
header(); // en parallèle du contenu de la page : rien ici ne dépend de l'en-tête

const id = new URLSearchParams(location.search).get('id');
const { data: s } = await sb.from('seller_profiles').select('*').eq('id', id).maybeSingle();
if (!s) {
  $('#app').innerHTML = '<p>Boutique introuvable. <a class="lnk" href="boutique/vendeuses.html">Voir toutes les vendeuses</a></p>';
  throw 0;
}
const { data: p } = await sb.from('products').select(PSEL).eq('seller_id', id).eq('is_approved', true).order('created_at', { ascending: false });
const P = p || [];
document.title = `${s.shop_name} — Les Reines de l’Entrepreneuriat`;

// Bannière affichée en entier (quel que soit son format) sur un fond flouté de la même image.
const cover = s.cover_path
  ? `<div class="shop-cover"><div class="shop-cover-bg" style="background-image:url(${img(s.cover_path)})"></div><img src="${img(s.cover_path)}" alt=""></div>`
  : '<div class="shop-cover shop-cover-empty"></div>';
const meta = [
  s.location && [ic('store'), esc(s.location)],
  s.hours && [ic('clock'), esc(s.hours)],
  [ic('box'), `${P.length} produit${P.length > 1 ? 's' : ''}`]
].filter(Boolean);
const wa = s.whatsapp ? waLink(s.whatsapp, `Bonjour ${s.shop_name}, je vous écris depuis Les Reines de l’Entrepreneuriat.`) : '';

$('#app').innerHTML = `<section class="shop-hero">${cover}
  <div class="shop-head">
    ${s.logo_path ? `<img class="av" src="${img(s.logo_path)}" alt="">` : `<div class="av">${esc(s.shop_name[0])}</div>`}
    <div class="shop-id"><h1>${esc(s.shop_name)}</h1><div class="shop-meta">${meta.map(([i, t]) => `<span>${i}${t}</span>`).join('')}</div></div>
    ${wa ? `<a class="btn wapp shop-wa" href="${wa}" target="_blank" rel="noopener">${ic('chat')}Écrire à la boutique</a>` : ''}
  </div>
  ${s.description ? `<p class="shop-desc">${esc(s.description)}</p>` : ''}
</section>
<div class="sh"><h2>Produits</h2><span class="mut">${P.length} produit${P.length > 1 ? 's' : ''}</span></div>
<div class="prods">${P.map(card).join('') || '<p class="mut">Aucun produit publié pour le moment.</p>'}</div>`;
</script></body></html>
