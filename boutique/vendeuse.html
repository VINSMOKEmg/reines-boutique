<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique — Les Reines de l’Entrepreneuriat</title><link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap"><div class="card"><div id="hdr"></div><div id="bn"></div>
<main id="app" class="w"></main>
<footer class="foot" id="ftr"></footer></div></div>
<script type="module">
import {sb,me,requireRole} from './js/supabase.js';
import * as cart from './js/cart.js';
import {$,esc,money,img,firstImg,toast,card,PSEL,header,seller,logout,ic,ICONS,favs,mini} from './js/ui.js';
const user=await header();

const id=new URLSearchParams(location.search).get('id');
const {data:s}=await sb.from('seller_profiles').select('*').eq('id',id).maybeSingle();
if(!s){$('#app').innerHTML='<p>Boutique introuvable.</p>';throw 0}
const {data:p}=await sb.from('products').select(PSEL).eq('seller_id',id).eq('is_approved',true);
$('#app').innerHTML=`<div class="cover" style="${s.cover_path?`background-image:url(${img(s.cover_path)})`:''}"></div><div class="sprof">${s.logo_path?`<img class="av" src="${img(s.logo_path)}" alt="">`:`<div class="av">${esc(s.shop_name[0])}</div>`}<div><h1 style="margin:0">${esc(s.shop_name)}</h1><span class="mut">${esc(s.location||'')}</span></div></div>
<p style="white-space:pre-line">${esc(s.description||'')}</p>${s.hours?`<p class="mut">Horaires : ${esc(s.hours)}</p>`:''}<h2>Produits</h2><div class="prods">${(p||[]).map(card).join('')||'<p class="mut">Aucun produit publié pour le moment.</p>'}</div>`;

</script></body></html>
