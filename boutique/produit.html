<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produit — Les Reines de l’Entrepreneuriat</title>
<meta name="description" content="Une création des Reines de l’Entrepreneuriat, vendue directement par celle qui la fabrique. Commandez et échangez avec la vendeuse sur WhatsApp.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Les Reines de l’Entrepreneuriat"><meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Produit — Les Reines de l’Entrepreneuriat"><meta property="og:description" content="Une création des Reines de l’Entrepreneuriat, vendue directement par celle qui la fabrique. Commandez et échangez avec la vendeuse sur WhatsApp.">
<meta property="og:image" content="https://lesreinesboutique.com/assets/hero.jpg"><meta property="og:image:width" content="1305"><meta property="og:image:height" content="1205"><meta name="twitter:card" content="summary_large_image"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6a1233"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Les Reines"><link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://wxdmdvxmxhoijfyshyyg.supabase.co" crossorigin>
<link rel="modulepreload" href="js/vendor/supabase.js"><link rel="modulepreload" href="js/supabase.js"><link rel="modulepreload" href="js/config.js"><link rel="modulepreload" href="js/cart.js"><link rel="modulepreload" href="js/ui.js">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap"><div class="card"><div id="hdr"></div><div id="bn"></div>
<div class="bc" id="bc"></div><div class="pdw" id="pd"><div class="sk sk-pd" aria-hidden="true"></div><div aria-hidden="true"><i class="sk skl sk-h"></i><i class="sk skl half" style="height:22px"></i><i class="sk skl"></i><i class="sk skl"></i><i class="sk skl xs"></i><i class="sk skb" style="height:46px;margin-top:22px"></i><i class="sk skb" style="height:46px"></i></div></div>
<footer class="foot" id="ftr"></footer></div></div>
<script type="module">
import { sb, me } from './js/supabase.js';
import * as cart from './js/cart.js';
import { $, esc, money, img, toast, header, ic, favs, mini } from './js/ui.js';
header(); // en parallèle du contenu de la page : rien ici ne dépend de l'en-tête

const id = new URLSearchParams(location.search).get('id');
const { data: p } = await sb
  .from('products')
  .select('*,categories(name),seller_profiles(id,shop_name,logo_path,location),product_images(path,position)')
  .eq('id', id)
  .maybeSingle();
if (!p) {
  $('#pd').innerHTML = '<p>Produit introuvable. <a class="lnk" href="boutique/catalogue.html">Retour à la boutique</a></p>';
  throw 0;
}

const im = [...p.product_images].sort((a, b) => a.position - b.position),
  S = p.seller_profiles,
  I = im.length ? im : [{ path: null }];
const dispo = p.is_available && p.stock !== 0; // stock vide = illimité
const max = p.stock == null ? 99 : Math.min(99, p.stock); // quantité maximale commandable
const opts = p.options || [];
let qty = 1;

$('#bc').innerHTML =
  `<a href="index.html">Accueil</a> › <a href="boutique/catalogue.html">Boutique</a> › ` +
  (p.categories ? `<a href="boutique/catalogue.html?c=${p.category_id}">${esc(p.categories.name)}</a> › ` : '') +
  esc(p.name);

const etat = !p.is_available
  ? 'Indisponible'
  : p.stock === 0
    ? 'Épuisé'
    : `<span class="ok">${p.stock == null ? 'Disponible' : p.stock <= 5 ? `Plus que ${p.stock} en stock` : `${p.stock} en stock`}</span>`;
$('#pd').innerHTML =
  `<div class="gal"><div class="thv">${I.map((i, k) => `<img class="${k ? '' : 'on'}" src="${img(i.path)}" alt="">`).join('')}</div>
  <div class="ph big"><img id="big" src="${img(I[0].path)}" alt="${esc(p.name)}"><button type="button" class="heart ${favs().includes(p.id) ? 'on' : ''}" data-fav="${p.id}" aria-label="Favori">${ic('heart')}</button></div></div>
<div class="info"><h1>${esc(p.name)}</h1>
  <a class="sline" href="boutique/vendeuse.html?id=${S.id}">${mini(S)}<span>${esc(S.shop_name)}<br><small class="mut">${esc(S.location || '')}</small></span></a>
  <div class="price">${money(p.price_fcfa)}</div><p>${esc(p.description)}</p>
  ${
    dispo
      ? `
  ${opts.length ? `<div class="optrow"><span>${esc(p.option_label || 'Option')}</span><div class="optlist" role="radiogroup" aria-label="${esc(p.option_label || 'Option')}">${opts.map(o => `<label><input type="radio" name="opt" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div></div>` : ''}
  <div class="qrow"><span>Quantité</span><div class="q"><button type="button" id="qm" aria-label="Moins">−</button><b id="qv">1</b><button type="button" id="qp" aria-label="Plus">+</button></div></div>
  <div class="act2"><button class="btn pk" id="buyb">Commander</button><button class="btn wa" id="addb">Ajouter au panier</button><a class="btn out" href="boutique/vendeuse.html?id=${S.id}">Voir la boutique</a></div>`
      : `<p><b>${p.stock === 0 ? 'Produit épuisé' : 'Produit indisponible'}</b></p><a class="btn out" href="boutique/vendeuse.html?id=${S.id}">Voir la boutique</a>`
  }
  <ul><li>Catégorie : ${esc(p.categories?.name || '—')}</li><li>${etat}</li></ul></div>`;

document.querySelectorAll('.thv img').forEach(
  t =>
    (t.onclick = () => {
      $('#big').src = t.src;
      document.querySelectorAll('.thv img').forEach(x => x.classList.toggle('on', x === t));
    })
);

if (dispo) {
  const set = n => {
    qty = Math.max(1, Math.min(max, n));
    $('#qv').textContent = qty;
  };
  $('#qm').onclick = () => set(qty - 1);
  $('#qp').onclick = () => {
    if (qty >= max && p.stock != null) toast(`Seulement ${p.stock} en stock.`, 1);
    set(qty + 1);
  };
  // Option obligatoire quand le produit en propose.
  const choix = () => {
    const o = document.querySelector('[name=opt]:checked')?.value || '';
    if (opts.length && !o) {
      toast(`Choisissez ${(p.option_label || 'une option').toLowerCase()} avant de continuer.`, 1);
      return null;
    }
    return o;
  };
  $('#addb').onclick = () => {
    const o = choix();
    if (o === null) return;
    cart.add(p.id, qty, o);
    toast('Produit ajouté au panier');
  };
  $('#buyb').onclick = async () => {
    const o = choix();
    if (o === null) return;
    cart.add(p.id, qty, o);
    location.href = (await me()) ? 'boutique/panier.html' : 'compte/connexion.html?next=boutique/panier.html';
  };
}
</script></body></html>
