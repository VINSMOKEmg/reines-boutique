<div class="wrap"><div class="card"><div id="hdr"></div><div id="bn"></div>
<div class="blk"><div class="sh"><h2>Nos vendeuses</h2></div><div class="sellers" id="sellers"><div class="s" aria-hidden="true"><div class="av sk"></div><i class="sk skl c"></i><i class="sk skl c half"></i><i class="sk skb c"></i></div><div class="s" aria-hidden="true"><div class="av sk"></div><i class="sk skl c"></i><i class="sk skl c half"></i><i class="sk skb c"></i></div><div class="s" aria-hidden="true"><div class="av sk"></div><i class="sk skl c"></i><i class="sk skl c half"></i><i class="sk skb c"></i></div><div class="s" aria-hidden="true"><div class="av sk"></div><i class="sk skl c"></i><i class="sk skl c half"></i><i class="sk skb c"></i></div><div class="s" aria-hidden="true"><div class="av sk"></div><i class="sk skl c"></i><i class="sk skl c half"></i><i class="sk skb c"></i></div><div class="s" aria-hidden="true"><div class="av sk"></div><i class="sk skl c"></i><i class="sk skl c half"></i><i class="sk skb c"></i></div></div></div>
<footer class="foot" id="ftr"></footer></div></div>
<script type="module">
import { sb } from './js/supabase.js';
import { $, esc, img, header } from './js/ui.js';
header(); // en parallèle du contenu de la page : rien ici ne dépend de l'en-tête

import { DEMO } from './js/demo.js';
import { DEMO_WHEN_EMPTY as DEMO_ON } from './js/config.js';
const { data } = await sb
  .from('seller_profiles')
  .select('id,shop_name,logo_path,location')
  .eq('status', 'active')
  .order('shop_name');
// Mêmes exemples que sur l'accueil tant qu'aucune boutique n'existe, pour que le lien « Voir toutes les vendeuses » ne mène pas à une page vide.
const demo = !(data && data.length) && DEMO_ON;
$('#sellers').innerHTML = demo
  ? '<p class="note demo-note">Exemples de présentation : les boutiques des membres arrivent bientôt.</p>' +
    DEMO.sellers
      .map(
        x =>
          `<div class="s"><div class="av">${esc(x.shop_name[0])}</div><b>${esc(x.shop_name)}</b><small>${esc(x.location)}</small><button class="btn out sm" data-demo>Voir la boutique</button></div>`
      )
      .join('')
  : (data || [])
      .map(
        x =>
          `<div class="s">${x.logo_path ? `<img class="av" src="${img(x.logo_path)}" alt="">` : `<div class="av">${esc(x.shop_name[0])}</div>`}<b>${esc(x.shop_name)}</b><small>${esc(x.location || '')}</small><a class="btn out sm" href="boutique/vendeuse.html?id=${x.id}">Voir la boutique</a></div>`
      )
      .join('') || '<p class="mut">Les premières boutiques arrivent bientôt.</p>';
</script></body></html>
