<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — Les Reines de l’Entrepreneuriat</title><link rel="icon" href="assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap"><div class="card"><div id="hdr"></div><div id="bn"></div>
<div class="shell"><aside id="side"></aside><main id="app" class="main"></main></div>
<footer class="foot"><a class="brand" href="index.html"><img src="assets/logo.jpg" alt=""><span><b>Les Reines</b><small>de l’Entrepreneuriat</small></span></a><div class="fl"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 6h13v10H1z"/><path d="M14 9h4l3 3v4h-7"/></svg>Livraison<br>selon la vendeuse</span><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l13-3v3"/></svg>Paiement<br>à la vendeuse</span><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Service client<br>via WhatsApp</span></div><div class="fc">© 2026 Les Reines de l’Entrepreneuriat. Tous droits réservés.</div></footer></div></div>
<script type="module">
import {sb,me,requireRole} from './js/supabase.js';
import * as cart from './js/cart.js';
import {$,esc,money,img,firstImg,toast,card,PSEL,header,seller,logout,ic,ICONS,favs,mini,normPhone,PHONE_ERR} from './js/ui.js';
const user=await header();

const a=await requireRole(['admin']);if(!a)throw 0;
$('#side').innerHTML='<h4>Espace Administrateur</h4><a class="on" href="#">Tableau de bord</a><a href="#ml">Membres</a><a href="#sl">Vendeuses</a><a href="#pl">Produits</a><a href="#cl">Catégories</a>';
const cn=async t=>(await sb.from(t).select('id',{count:'exact',head:true})).count||0;
const [ns,np,no]=await Promise.all([cn('seller_profiles'),cn('products'),cn('orders')]);
$('#app').innerHTML=`<span class="eyebrow">Espace administrateur</span><h1 style="font-size:40px">Administration</h1><p><button class="btn ghost sm" id="lo">Déconnexion</button></p><div class="kp"><div><b>${ns}</b>Vendeuses</div><div><b>${np}</b>Produits</div><div><b>${no}</b>Commandes</div></div>

<h2>Membres du groupe</h2><form id="pr" style="display:flex;gap:8px;flex-wrap:wrap"><input name="n" placeholder="Nom" style="padding:11px;border:1px solid var(--line);border-radius:6px"><input type="email" name="e" required placeholder="E-mail de la membre" style="padding:11px;border:1px solid var(--line);border-radius:6px;min-width:260px"><button class="btn">Ajouter</button></form><div class="tw" id="ml" style="margin-top:14px"></div>
<h2 style="margin-top:32px">Vendeuses</h2><div class="tw" id="sl"></div><h2 style="margin-top:32px">Produits</h2><div class="tw" id="pl"></div><h2 style="margin-top:32px">Niches (catégories)</h2><div id="cl"></div>
<dialog id="dl"><form class="f" id="df"></form></dialog>`;$('#lo').onclick=logout;
const ik=Object.keys(ICONS);
function edit(title,fields,save){const d=$('#dl');$('#df').innerHTML=`<h3>${title}</h3>`+fields.map(x=>`<label>${x.l}${x.t==='area'?`<textarea name="${x.k}" rows="3">${esc(x.v||'')}</textarea>`:`<input name="${x.k}" type="${x.t||'text'}" value="${esc(x.v??'')}">`}</label>`).join('')+'<p style="display:flex;gap:8px"><button class="btn">Enregistrer</button><button type="button" class="btn ghost" id="cx">Annuler</button></p>';
 $('#cx').onclick=()=>d.close();$('#df').onsubmit=async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));try{await save(fd,e.target);d.close();toast('Modifications enregistrées');load()}catch(x){toast(x.message||'Échec',1)}};d.showModal()}
$('#pr').onsubmit=async e=>{e.preventDefault();const f=e.target;const {error}=await sb.from('member_whitelist').insert({email:f.e.value.trim().toLowerCase(),full_name:f.n.value.trim()||null});toast(error?(error.code==='23505'?'Déjà dans la liste':error.message):'Membre ajoutée',!!error);if(!error){f.reset();load()}};
async function load(){
 const [mw,rg]=await Promise.all([sb.from('member_whitelist').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('id,email').eq('role','seller')]);const MW=mw.data||[],RG=rg.data||[];
 $('#ml').innerHTML='<table><tr><th>Membre</th><th>Inscription</th><th></th></tr>'+(MW.map(x=>{const r=RG.find(y=>(y.email||'').toLowerCase()===x.email);return `<tr><td><b>${esc(x.full_name||'')}</b><br><small class="mut">${esc(x.email)}</small></td><td><span class="badge ${r?'ok':''}">${r?'Boutique créée':'Pas encore inscrite'}</span></td><td><button class="btn ghost sm" data-rm="${x.id}">Retirer</button></td></tr>`}).join('')||'<tr><td colspan="3" class="mut">Aucune membre pour le moment.</td></tr>')+'</table>';
 const [s,p,c]=await Promise.all([sb.from('seller_profiles').select('*').order('created_at'),sb.from('products').select('id,name,description,price_fcfa,is_approved,seller_profiles(shop_name),product_images(path)').order('created_at',{ascending:false}).limit(80),sb.from('categories').select('id,name,icon').order('name')]);
 const S=s.data||[],P=p.data||[];
 $('#sl').innerHTML='<table><tr><th>Boutique</th><th>Statut</th><th>Actions</th></tr>'+S.map(x=>`<tr><td><b>${esc(x.shop_name)}</b><br><small class="mut">${esc(x.whatsapp||'pas de WhatsApp')}</small></td><td><span class="badge ${x.status==='active'?'ok':'no'}">${x.status==='active'?'Active':'Suspendue'}</span></td>
 <td><button class="btn ghost sm" data-es="${x.id}">Modifier</button> <button class="btn ghost sm" data-st="${x.status==='active'?'suspended':'active'}" data-id="${x.id}">${x.status==='active'?'Suspendre':'Réactiver'}</button></td></tr>`).join('')+'</table>';
 $('#pl').innerHTML='<table><tr><th>Produit</th><th>État</th><th>Actions</th></tr>'+P.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small class="mut">${esc(x.seller_profiles?.shop_name)} · ${money(x.price_fcfa)}</small></td><td><span class="badge ${x.is_approved?'ok':'no'}">${x.is_approved?'Publié':'Désactivé'}</span></td>
 <td><button class="btn ghost sm" data-ep="${x.id}">Modifier</button> <button class="btn ghost sm" data-ap="${x.id}" data-v="${x.is_approved}">${x.is_approved?'Désactiver':'Réactiver'}</button> <button class="btn ghost sm" data-dp="${x.id}">Supprimer</button></td></tr>`).join('')+'</table>';
 $('#cl').innerHTML=(c.data||[]).map(x=>`<span class="badge" style="display:inline-flex;gap:6px;align-items:center;margin:0 6px 6px 0">${ic(x.icon)}${esc(x.name)} <a href="#" data-dc="${x.id}">×</a></span>`).join('')+`<form id="cf" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><select name="i" style="padding:10px">${ik.slice(0,16).map(k=>`<option>${k}</option>`).join('')}</select><input name="n" required placeholder="Nouvelle niche" style="padding:10px;border:1px solid var(--line);border-radius:6px"><button class="btn sm">Ajouter</button></form>`;
 $('#cf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('categories').insert({name:e.target.n.value.trim(),icon:e.target.i.value});toast(error?error.message:'Niche ajoutée',!!error);load()};
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(!confirm('Retirer cette membre ? Sa boutique sera suspendue.'))return;const m=MW.find(y=>y.id===b.dataset.rm);const r=RG.find(y=>(y.email||'').toLowerCase()===m.email);if(r)await sb.from('seller_profiles').update({status:'suspended'}).eq('id',r.id);await sb.from('member_whitelist').delete().eq('id',m.id);load()});
 document.querySelectorAll('[data-es]').forEach(b=>b.onclick=()=>{const x=S.find(y=>y.id===b.dataset.es);edit('Modifier la boutique',[{k:'shop_name',l:'Nom de la boutique',v:x.shop_name},{k:'whatsapp',l:'WhatsApp (ex. 221770000000)',v:x.whatsapp},{k:'location',l:'Localisation',v:x.location},{k:'description',l:'Description',t:'area',v:x.description},{k:'logo',l:'Nouveau logo',t:'file'}],async(v,f)=>{const wa=v.whatsapp.trim()?normPhone(v.whatsapp):null;if(v.whatsapp.trim()&&!wa)throw new Error(PHONE_ERR);const o={shop_name:v.shop_name.trim(),whatsapp:wa,location:v.location.trim(),description:v.description.trim()};const fl=f.logo.files[0];
  if(fl){if(!['image/jpeg','image/png','image/webp'].includes(fl.type)||fl.size>3145728)throw new Error('Image invalide (JPG, PNG, WebP, 3 Mo max)');const path=`${x.id}/logo-${Date.now()}.${fl.type.split('/')[1]}`;const u=await sb.storage.from('shop-media').upload(path,fl,{contentType:fl.type});if(u.error)throw u.error;o.logo_path=path}
  const {error}=await sb.from('seller_profiles').update(o).eq('id',x.id);if(error)throw error})});
 document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{const x=P.find(y=>y.id===b.dataset.ep);edit('Modifier le produit',[{k:'name',l:'Nom',v:x.name},{k:'price',l:'Prix (FCFA)',t:'number',v:x.price_fcfa},{k:'description',l:'Description',t:'area',v:x.description}],async v=>{const {error}=await sb.from('products').update({name:v.name.trim(),price_fcfa:Number(v.price),description:v.description.trim()}).eq('id',x.id);if(error)throw error})});
 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{await sb.from('seller_profiles').update({status:b.dataset.st}).eq('id',b.dataset.id);load()});
 document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{await sb.from('products').update({is_approved:b.dataset.v!=='true'}).eq('id',b.dataset.ap);load()});
 document.querySelectorAll('[data-dp]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer ce produit définitivement ?'))return;const {error}=await sb.from('products').delete().eq('id',b.dataset.dp);toast(error?'Suppression impossible (produit déjà commandé : désactivez-le)':'Produit supprimé',!!error);load()});
 document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=async e=>{e.preventDefault();const {error}=await sb.from('categories').delete().eq('id',b.dataset.dc);toast(error?'Niche utilisée : suppression impossible':'Niche supprimée',!!error);load()})}
load();

</script></body></html>
